name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flask pandas "numpy<2.0.0" scikit-learn joblib seaborn flake8 pytest
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,models,data,plots,notebooks,app/static,temp_venv
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,models,data,plots,notebooks,app/static,temp_venv
    - name: Train model
      run: |
        python train.py
    - name: List files
      run: |
        ls -R
    - name: Verify Flask Installation
      run: |
        python -c "import flask; print('Flask version:', flask.__version__)"
    - name: Test with pytest
      run: |
        # Use python -m pytest to ensure current directory is in sys.path
        python -m pytest