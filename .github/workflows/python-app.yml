name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Force reinstall to be sure
        python -m pip install --force-reinstall flask pandas "numpy<2.0.0" scikit-learn joblib seaborn flake8 pytest
    - name: Debug Environment
      run: |
        python -m pip list
    - name: Run Manual Test
      run: |
        python manual_test.py
    - name: Train model
      run: |
        python train.py
    - name: Test with pytest
      run: |
        python -m pytest -v -s